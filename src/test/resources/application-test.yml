spring:
  datasource:
    url: jdbc:h2:mem:linkedin_portal_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false

jwt:
  secret: test-secret-12345678901234567890
  expiration-ms: 3600000
  refresh-expiration-ms: 7200000
